<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Face AR Filter</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: Arial, sans-serif; }
    body { position: fixed; inset: 0; touch-action: none; }
    a-scene { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none !important; }
    a-scene canvas { pointer-events: none !important; }
    .hint { position: fixed; z-index: 10; top: 16px; left: 0; right: 0; text-align: center; color: white; text-shadow: 0 1px 5px #000; pointer-events: none; }
  </style>
</head>
<body>
  <div class="hint">หันหน้าเข้ากล้องเพื่อใช้งานฟิลเตอร์</div>
  <a-scene mindar-face embedded color-space="sRGB" renderer="alpha: true; colorManagement: true; physicallyCorrectLights: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-assets>
      <a-asset-item id="glassesModel" src="./glasses_project.glb"></a-asset-item>
      <a-asset-item id="hatModel" src="./the_witchs_hat.glb"></a-asset-item>
    </a-assets>

    <a-entity light="type: ambient; color: #ffffff; intensity: 1.5"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 1.2" position="0 1 1"></a-entity>

    <!-- จุดยึดอยู่กึ่งกลางระหว่างดวงตา; เลื่อนโมเดลเพื่อชดเชย pivot ที่เยื้องไปทางแว่นข้างขวา -->
    <a-entity mindar-face-target="anchorIndex: 168">
      <a-gltf-model src="#glassesModel" position="-0.4 0 0.02" rotation="0 90 0" scale="0.005 0.005 0.005"></a-gltf-model>
    </a-entity>

    <!-- หมวกยึดจุด 10 บริเวณหน้าผาก -->
    <a-entity mindar-face-target="anchorIndex: 10">
      <a-gltf-model src="#hatModel" position="0 0.85 -0.15" rotation="0 0 0" scale="0.01 0.01 0.01"></a-gltf-model>
    </a-entity>

    <a-camera active="false" position="0 0 0" look-controls="enabled: false" wasd-controls="enabled: false"></a-camera>
  </a-scene>
</body>
</html>
