<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Face AR Filter</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#111}
    a-scene{width:100%;height:100%}
    .hint{position:fixed;z-index:10;top:16px;left:0;right:0;text-align:center;color:white;text-shadow:0 1px 5px #000;pointer-events:none}
  </style>
</head>
<body>
  <div class="hint">หันหน้าเข้ากล้องเพื่อใช้งานฟิลเตอร์</div>
  <a-scene mindar-face embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-assets>
      <a-asset-item id="glassesModel" src="./glasses_project.glb"></a-asset-item>
      <a-asset-item id="hatModel" src="./the_witchs_hat.glb"></a-asset-item>
    </a-assets>

    <!-- แว่น: ยึดบริเวณดั้งจมูก -->
    <a-entity mindar-face-target="anchorIndex: 168">
      <a-gltf-model src="#glassesModel" position="0 0 0.02" rotation="0 0 0" scale="0.35 0.35 0.35"></a-gltf-model>
    </a-entity>

    <!-- หมวก: ยึดบริเวณหน้าผากด้านบน -->
    <a-entity mindar-face-target="anchorIndex: 10">
      <a-gltf-model src="#hatModel" position="0 0.65 -0.05" rotation="0 0 0" scale="0.45 0.45 0.45"></a-gltf-model>
    </a-entity>

    <a-camera active="false" position="0 0 0"></a-camera>
  </a-scene>
</body>
</html>
